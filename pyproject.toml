[project]
name = "wys2026-birthday-game"
version = "0.1.0"
description = "A Pygame platform adventure game"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "moviepy>=1.0.3,<2",
    "numpy>=2.1,<3",
    "opencv-python>=4.10,<5",
    "pillow>=11,<13",
    "psd-tools>=1.10,<2",
    "pygame>=2.6.1,<3",
]

[dependency-groups]
dev = [
    "pyinstaller>=6,<7",
    "ruff>=0.9,<1",
]
